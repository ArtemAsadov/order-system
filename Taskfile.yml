version: '3'

tasks:
  up:
    desc: "Запустить все сервисы"
    cmds:
      - docker compose up -d
      - task: ps
    silent: true

  down:
    desc: "Остановить все сервисы"
    cmds:
      - docker compose down
    silent: true

  clean:
    desc: "Полностью очистить данные"
    cmds:
      - docker compose down -v
    silent: true

  ps:
    desc: "Статус сервисов"
    cmds:
      - echo "🏥 Статус сервисов:"
      - docker compose ps
    silent: true

  logs:
    desc: "Логи всех сервисов"
    cmds:
      - docker compose logs -f

  logs-kafka:
    desc: "Логи Kafka"
    cmds:
      - docker compose logs -f kafka

  health:
    desc: "Проверка здоровья сервисов"
    cmds:
      - echo "🩺 Проверка подключений:"
      - docker compose ps --format "table {{.Name}}\t{{.Status}}"
      - echo ""
      - echo "📡 Redis:"
      - docker exec order-system-redis redis-cli PING
      - echo ""
      - echo "🐘 PostgreSQL:"
      - docker exec order-system-postgres pg_isready -U orderuser
      - echo ""
      - echo "🐰 RabbitMQ:"
      - curl -s -u orderuser:orderpass http://localhost:15672/api/health/checks/alarms | head -c 100
      - echo ""
      - echo "📨 Kafka:"
      - docker exec order-system-kafka /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 2>/dev/null | head -1

  # Kafka commands
  kafka-topics:
    desc: "Список топиков Kafka"
    cmds:
      - docker exec order-system-kafka /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092

  kafka-create-topic:
    desc: "Создать топик в Kafka"
    cmds:
      - docker exec order-system-kafka /opt/kafka/bin/kafka-topics.sh --create --topic {{.CLI_ARGS}} --bootstrap-server localhost:9092

  kafka-produce:
    desc: "Отправить сообщение в Kafka"
    cmds:
      - echo {{.CLI_ARGS}} | docker exec -i order-system-kafka /opt/kafka/bin/kafka-console-producer.sh --topic user-logs --bootstrap-server localhost:9092

  kafka-consume:
    desc: "Прочитать сообщения из Kafka"
    cmds:
      - docker exec order-system-kafka /opt/kafka/bin/kafka-console-consumer.sh --topic user-logs --bootstrap-server localhost:9092 --from-beginning --max-messages {{.CLI_ARGS | default 10}}

  # RabbitMQ commands
  rabbitmq-status:
    desc: "Статус RabbitMQ"
    cmds:
      - curl -s -u orderuser:orderpass http://localhost:15672/api/overview

  # Redis commands
  redis-cli:
    desc: "Redis CLI"
    cmds:
      - docker exec -it order-system-redis redis-cli

  # PostgreSQL commands
  psql:
    desc: "PostgreSQL CLI"
    cmds:
      - docker exec -it order-system-postgres psql -U orderuser -d orders_db